<html>
    <head>
        <meta charset="UTF-8"/>
        <meta http-equiv="refresh" content="30"/>
        <title>Result</title>
    </head>
    <style>
        table{border-collapse: collapse}
        th,td{border: 1px solid #ccc; padding: 6px 8px; text-align: center; font-size: 13px}
        th{background: blue; color: white}
        .b1{display: inline-block; width: 20px; height: 20px; line-height: 20px; border-radius: 4px; background: yellow; margin: 1px;}
        .b0{display: inline-block; width: 20px; height: 20px; line-height: 20px; border-radius: 4px; background: #ccc; margin: 1px;}

    </style>
    <body>
        <h2>Result</h2>
        <table id="t"></table>
    </body>
    <script>
        const Q = {{ Q }};
        const P = {{ P }};
        document.getElementById("t").innerHTML =
            '<tr><th>序号</th><th>个人信息</th>'+Q.map(k=>`<th>${k}</th>`).join('')+'<th>总分</th><th>判分次数</th></tr>' +
            P.map(p => `<tr><td>${p.no}</td><td>${p.info}</td>` + Q.map(k => `<td>${p[k].map(v => v?`<b class="b1">1</b>`:`<b class="b0">0</b>`).join('')}</td>`).join('') +
                `<td>${p.sum}</td><td>${p.num}</td></tr>`).join('');
    </script>
</html>
